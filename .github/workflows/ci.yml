name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: on Ubuntu 26.04 /usr/bin/env is a symlink to the multicall coreutils
    # binary, which the Codex session-launcher characterization tests reject as an
    # unsafe executable. Production hosts ship a regular file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Test
        run: npm test
